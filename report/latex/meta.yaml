---
title: |
  Типология муниципальных экономик России: динамическая кластеризация на атрибутированной сети с годовыми окнами
authors: |
  Ахрамешин А. С., Маркелов В. Л.
venue: |
  Онлайн-конкурс СберИндекса 2026, направление «Кластеризация». Октябрь 2026.
abstract_ru: |
  Работа посвящена типологии 1 776 российских муниципальных образований (МО) по структуре безналичных расходов жителей и экономическому контексту на 13 скользящих годовых окнах (декабрь 2023 — декабрь 2024). МО образуют динамическую атрибутированную сеть: вершины описываются семью признаками расходов (логарифм уровня и шесть композиционных координат) и девятью признаками контекста по данным Росстата, рёбра задаются косинусным сходством годовых профилей расходов. Предложен метод GS-TKM (graph-smoothed temporal k-means): однократное сглаживание признаков по графу сходства, единые для всех окон центры типов и точная условная траектория типов каждой территории по алгоритму Витерби со штрафом за смену типа. По протоколу выбора выделено 5 типов; согласие разбиений при 50 пересборках на подвыборках (ARI) составляет 0,893. Типы различаются по показателям, не входившим в разбиение: региональный интервал эффекта типа целиком выше нуля для 5 из 6 внешних показателей Росстата и СберИндекса, а после контроля населения и зарплаты — для 3 из 6. Тип не улучшает пространственный перенос прогноза роста расходов сверх непрерывных признаков (снижение MAE 0,0001 лог. пункта; интервал включает нуль). Часть смен типа за год отражает общий сдвиг потребления по стране: после центрирования признаков по окнам доля сменивших тип снижается с 16,9% до 7,8%. Результаты воспроизводимы, включая пересборки, чувствительность и проверки; приведены также ограничения метода.
---

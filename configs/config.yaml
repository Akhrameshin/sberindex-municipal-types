# Единый конфиг пайплайна. Все параметры, влияющие на результат, — здесь.
seed: 42
data:
  min_months: 24                # в типологию входят только МО с полным рядом: иначе дорисованная константа занижает churn и подменяет данные
  rosstat_year: 2023            # год статических признаков Росстата
  rosstat_years_download: [2022, 2023, 2024]
features:
  smooth_window: 3              # скользящее среднее по месяцам
  clip_z: 4                     # обрезка z-оценок (устойчивость к выбросам малых МО)
  trim_months: 2                # отбрасываем месяцы с неполным окном сглаживания
graph:
  k: 15                         # взаимный kNN, косинусное расстояние
  k_min_neighbors: 3            # страховка от изолятов
temporal:
  omega: 0.2                    # связь между слоями-месяцами (мультислойный Leiden)
  resolution_targets: [5, 7, 9] # целевое число кластеров для калибровки γ
  headline_target: 7            # заголовочное разбиение (выбрано по макс. устойчивости при ω=0.2)
compare:
  k: 5                          # K для классических методов (= подробный уровень заголовочного метода)
  noise_sigma: 0.15
  noise_reps: 3
bootstrap:
  reps: 10
significance:
  n_null: 1000            # нулей на каждую модель; p-пол = 1/(n_null+1)
validation:
  n_perm: 1000            # перестановки типов внутри регионов; p-пол = 1/(n_perm+1)
headline:                       # заголовочный метод: граф-сглаженный временной k-means (GS-TKM)
  smooth_steps: 1               # X̃ = Â^s X (SGC): сеть входит в разбиение
  lam: 0.5                      # штраф Витерби за смену типа (в долях медианного расстояния до центра)
  Ks: [4, 5]                    # макро- и подробный уровни
